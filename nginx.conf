server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /admin/assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 2026-10-18: index.html sem cache, pra aba aberta pegar a versao nova ao recarregar
    # (os assets tem nome com hash e continuam com cache longo).
    location /admin {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /admin/index.html;
    }

    # 2026-10-28: navegador e WhatsApp pedem /favicon.ico na raiz; devolve a logo da LA.
    location = /favicon.ico {
        alias /usr/share/nginx/html/admin/favicon.ico;
    }

    location / {
        try_files $uri $uri/ /admin/index.html;
    }
}
