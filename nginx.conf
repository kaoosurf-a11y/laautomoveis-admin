# 2026-10-28 (Felipe): painel na raiz de app.laautomoveis.com.br. É o servidor padrão.
server {
    listen 80 default_server;
    server_name app.laautomoveis.com.br;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html, sw.js e manifest sem cache, pra aba aberta pegar a versao nova ao recarregar
    # (os assets tem nome com hash e continuam com cache longo).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# Endereço antigo: página "o painel mudou" (com o botão de baixar o app novo) em qualquer caminho.
# A página vai direto pro novo sozinha a partir de 12/11. O service worker antigo é trocado por um
# que desliga os avisos de lá.
server {
    listen 80;
    server_name admin.laautomoveis.com.br;
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";

    location = /admin/sw.js {
        default_type application/javascript;
        try_files /sw-antigo.js =404;
    }
    location = /favicon.ico {
        try_files /favicon.ico =404;
    }
    location / {
        default_type text/html;
        try_files /mudou.html =404;
    }
}
