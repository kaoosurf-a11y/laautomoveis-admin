<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#0c0c0a" />
    <!-- 2026-10-28 (Felipe): painel instalável como app no celular (tela inicial, tela cheia). -->
    <link rel="manifest" href="/admin/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/admin/icon-192.png" />
    <link rel="apple-touch-icon" href="/admin/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="LA Painel" />
    <title>LA Automóveis — Admin</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura (evita piscar escuro -> claro).
      try { if (localStorage.getItem("la_tema") === "light") { document.documentElement.setAttribute("data-theme", "light"); document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f2f2f7"); } } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
